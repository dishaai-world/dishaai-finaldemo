<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DishaAI™ – Agentic Student Intelligence Platform (Demo)</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mu:#64748b;--ln:#e2e8f0;--nv:#0b2a55;--tl:#0d9488;--rd:#dc2626;--am:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1120;--card:#121b2e;--tx:#e6edf7;--mu:#94a3b8;--ln:#26334d;--nv:#6ea8fe}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1120;--card:#121b2e;--tx:#e6edf7;--mu:#94a3b8;--ln:#26334d;--nv:#6ea8fe}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.app{display:flex;min-height:100vh}nav{width:218px;background:#0b2a55;color:#cbd5e1;padding:14px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{color:#fff;font-size:18px;margin:2px 8px 0}nav small{display:block;margin:0 8px 12px;font-size:10px;color:#7dd3c8}
nav a{display:block;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}nav a:hover{background:#ffffff14}nav a.on{background:#ffffff26;color:#fff;font-weight:600}nav hr{border:0;border-top:1px solid #ffffff24;margin:8px 0}
main{flex:1;min-width:0}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--ln);position:relative}
header b{font-size:15px}header span.t{color:var(--mu);font-size:12px;display:block}.pg{padding:16px 20px}
.g{display:grid;gap:12px}.c2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}.c3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.c4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;overflow-x:auto}.card h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{margin:0 0 2px;font-size:19px}.sub{color:var(--mu);margin:0 0 12px;font-size:13px}.k{cursor:pointer}.k:hover{border-color:var(--tl)}.k b{font-size:24px;display:block;color:var(--nv)}.k small{color:var(--mu)}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--ln);color:var(--tx);white-space:nowrap}.b.r{background:#fee2e2;color:#b91c1c}.b.a{background:#fef3c7;color:#92400e}.b.t{background:#ccfbf1;color:#0f766e}.b.gn{background:#dcfce7;color:#166534}.b.i{background:#e0e7ff;color:#3730a3}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-weight:600;font-size:12px}tr.cl:hover{background:var(--bg);cursor:pointer}
.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;margin:2px 4px 2px 0}.btn:hover{border-color:var(--tl)}.btn.p{background:#0b2a55;color:#fff;border-color:#0b2a55}.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:6px;padding:6px 8px;font-size:13px;margin:2px 6px 2px 0}
.br{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.br.cl{cursor:pointer}.bl{width:118px;flex:none}.bt{flex:1;background:var(--ln);height:9px;border-radius:5px;overflow:hidden}.bt div{height:100%}
.ch{width:100%;height:auto;max-height:230px}.ax{font-size:9px;fill:var(--mu)}.lg{font-size:11px;color:var(--mu)}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 8px}
.demo{background:#fef3c7;color:#92400e;font-weight:700;font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid #f59e0b}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.fb{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:12px;font-weight:600;color:var(--mu)}.fb.on{border-color:var(--tl);color:var(--tx);background:#ccfbf122}.ar{color:var(--tl);font-weight:700}
.note{border-left:3px solid var(--tl);background:var(--bg);padding:8px 10px;font-size:12px;margin:8px 0;border-radius:4px}.mu{color:var(--mu)}.pop{position:absolute;right:20px;top:58px;width:320px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;z-index:20;box-shadow:0 8px 24px #0003}
.lgo{position:relative;background:#fff;border-radius:10px;padding:12px 16px 10px;margin:2px 4px 10px}.lgo img{width:100%;display:block}.tm{position:absolute;top:3px;right:7px;font:700 9px/1 system-ui,sans-serif;color:#0b2a55}.hl{position:relative;display:inline-block;background:#fff;border-radius:8px;padding:4px 20px 4px 8px;margin-bottom:2px}.hl img{height:30px;display:block}.hl .tm{top:2px;right:5px}@media(max-width:760px){.lgo{display:none}}
footer{padding:10px 20px 20px;color:var(--mu);font-size:11px}
body{background:radial-gradient(1100px 480px at 85% -10%,#0d948822,transparent),var(--bg)}
nav{background:linear-gradient(180deg,#061a38,#0b2a55 60%,#0a3a5c)}nav h1{font-size:22px;letter-spacing:.3px}nav h1:before{content:"◈ ";color:#2dd4bf}
nav a{display:flex;gap:9px;align-items:center;margin:2px 0;border-left:3px solid transparent}nav a.on{background:#2dd4bf1f;border-left-color:#2dd4bf}.ic{color:#2dd4bf;width:16px;text-align:center}
header{position:sticky;top:0;z-index:15;backdrop-filter:blur(8px)}
.card{border-radius:14px;box-shadow:0 1px 2px #0b2a5510,0 6px 20px #0b2a5508;transition:.15s}.k{position:relative;overflow:hidden;padding-left:18px}.k:hover{transform:translateY(-2px);box-shadow:0 10px 26px #0d948828}.k:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a,var(--tl))}.k .ki{position:absolute;right:12px;top:10px;font-size:20px}.k b{font:700 28px ui-monospace,SFMono-Regular,Menlo,monospace}
.hero{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center;padding:22px;border-radius:16px;color:#e6f4f1;background:linear-gradient(120deg,#061a38,#0b2a55 55%,#0f4c5c);position:relative;overflow:hidden;border:1px solid #2dd4bf40}
.hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:28px 28px;pointer-events:none}.hero>*{position:relative;z-index:1}.hero h2{font-size:24px;color:#fff;margin:6px 0}.hero p{margin:0 0 12px;color:#a7c4d6;max-width:520px}
.eyebrow{font:700 11px ui-monospace,monospace;color:#2dd4bf;letter-spacing:1px}.eyebrow:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#2dd4bf;margin-right:6px;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.25}}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.pn{background:#ffffff12;border:1px solid #ffffff24;border-radius:10px;padding:6px 12px;min-width:84px}.pn b{font:700 20px ui-monospace,monospace;color:#fff;display:block}.pn small{color:#9fc0d0;font-size:10px}
.rings{display:flex;gap:10px}.ring{text-align:center;width:104px}.ring small{color:#a7c4d6;font-size:11px}.rv{font:700 18px ui-monospace,monospace;fill:var(--tx)}.hero .rv{fill:#fff}.hero svg circle:first-of-type{stroke:#ffffff26}.hero .btn.p{background:#2dd4bf;color:#042f2e;border:0;font-weight:700;padding:8px 16px}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn>div{flex:1;min-width:130px}.ph{border-left:4px solid var(--tl);padding-left:12px;margin-bottom:2px}.hm td{text-align:center;color:#fff;font-weight:600;font-size:12px;border:2px solid var(--card)}
@media(max-width:760px){.app{flex-direction:column}nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:6px}nav h1,nav small,nav hr{display:none}nav a{white-space:nowrap}}
